<a href="{{ include.link | relative_url }}" style="text-decoration: none; display: flex; height: 100%;">
  <div style="border-radius: 8px; overflow: hidden; transition: transform 0.3s ease; display: flex; flex-direction: column; width: 100%;">
    <img src="{{ include.image | relative_url }}" alt="{{ include.title }}" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;">
    <div style="flex: 1; padding: 15px; background: #d0d5d2; border-top: 2px solid #5a8a70;">
      <h3 style="margin: 0; color: #1a1a1a;">{{ include.title }}</h3>
      <p style="margin: 5px 0 0 0; color: #3d3d3d; font-size: 0.9em; min-height: 1.4em;">{{ include.role }}</p>
    </div>
  </div>
</a>
